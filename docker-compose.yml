version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rls_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rls_sample
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d rls_sample"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: